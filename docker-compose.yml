services:
  universal-video-scanner:
    build: .
    container_name: universal-video-scanner
    ports:
      - "2367:2367"
    volumes:
      - ./media:/media
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - FILE_WRITE_DELAY=5 # Interval in seconds between file size checks before scanning new files
      - AUTO_REFRESH_INTERVAL=10 # Interval for automatic updating of the web UI in seconds
      - METADATA_RETRY_INTERVAL=${METADATA_RETRY_INTERVAL:-30} # Minutes between retries for entries with incomplete metadata (0 = off)
      - TMDB_API_KEY=${TMDB_API_KEY:-}  # Add your TMDB API key here or set via .env file
      - FANART_API_KEY=${FANART_API_KEY:-}  # Add your Fanart.tv API key here or set via .env file
      - MDBLIST_API_KEY=${MDBLIST_API_KEY:-}  # MDBList API key for all ratings - IMDb, Rotten Tomatoes (Tomatometer + Audience), Trakt, Metacritic (optional; without it the TMDB rating is shown)
      - IMAGE_SOURCE=${IMAGE_SOURCE:-tmdb}  # Image source: 'tmdb' (default) or 'fanart'
      - CONTENT_LANGUAGE=${CONTENT_LANGUAGE:-en}  # Preferred content language: ISO 639-1 code (default: en)
      - SCAN_WORKERS=${SCAN_WORKERS:-1}  # Files probed in parallel during a bulk scan. 1 = sequential (safest for a single HDD). Try 2-4 for a NAS / SSD to scan faster
      - API_TOKEN=${API_TOKEN:-}  # Token for the /api/v1 API (openssl rand -hex 32). Empty = API disabled
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-}  # Origins a browser app may call /api/v1 from, comma-separated or '*'. Empty = same-origin only
