name: Build & Release Docker Image

on:
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: "Push image to Docker Hub (latest + version tag)"
        type: boolean
        default: true
      create_release:
        description: "Create a GitHub release with the image as .tar"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      # Image name on Docker Hub. Override by setting the repository variable
      # DOCKERHUB_IMAGE (e.g. "myuser/universal-video-scanner").
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/universal-video-scanner', secrets.DOCKERHUB_USERNAME) }}
      VERSION: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built once and loaded into the local daemon, so the very same image is
      # pushed to Docker Hub and packed into the release .tar.
      - name: Build Docker image (versioned + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            universal-video-scanner:${{ env.VERSION }}
            universal-video-scanner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        run: |
          docker tag universal-video-scanner:latest "${IMAGE}:${VERSION}"
          docker tag universal-video-scanner:latest "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Save Docker image as .tar
        if: ${{ inputs.create_release }}
        run: |
          docker save \
            universal-video-scanner:${VERSION} \
            universal-video-scanner:latest \
            -o universal-video-scanner.tar

      - name: Create GitHub Release and upload Docker image
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Docker Image Release
            Version: v${{ github.run_number }}
          files: universal-video-scanner.tar
          fail_on_unmatched_files: true
